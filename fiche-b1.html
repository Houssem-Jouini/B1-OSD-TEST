<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#090d16">
<title>Fiche de Révision — Allemand B1 ÖSD (Mots Fréquents &amp; Jeux Interactifs)</title>

<!-- Google Fonts: Plus Jakarta Sans (UI), Lora (Reading), JetBrains Mono (Stats) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<link rel="stylesheet" href="css/style.css">
</head>
<body class="fiche-b1-page-body">

  <!-- Sticky Top Navigation Bar -->
  <header class="navbar fiche-page-navbar">
    <div class="nav-container fiche-nav-container">
      <div class="fiche-nav-left">
        <a href="index.html" class="btn btn-outline fiche-back-btn" title="Retourner à la simulation d'examen (tes réponses sont sauvegardées)">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          <span>Retour à l'examen</span>
        </a>

        <div class="brand fiche-brand">
          <div class="brand-badge fiche-brand-badge">🔥 B1</div>
          <div class="brand-text-wrap">
            <div class="brand-title">Fiche de Révision — Allemand B1 ÖSD</div>
            <div class="brand-sub">205 Mots fréquents · 28 Verbes à prépositions · 5 Modes interactifs</div>
          </div>
        </div>
      </div>

      <!-- Search Bar in Header -->
      <div class="fiche-header-search">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="fichePageSearchInput" placeholder="Rechercher un mot (Allemand, Français, العربية)..." autocomplete="off">
        <button type="button" id="fichePageSearchClear" style="display:none;" title="Effacer la recherche">✕</button>
      </div>

      <!-- Reading Comfort Controls: Text Size & Theme -->
      <div class="fiche-nav-controls">
        <div class="fiche-size-pill" title="Ajuster la taille du texte pour un confort de lecture optimal">
          <span class="fiche-ctrl-label">Texte :</span>
          <button type="button" class="fiche-size-btn" data-fsize="md">Normal</button>
          <button type="button" class="fiche-size-btn active" data-fsize="lg">Grand (A+)</button>
          <button type="button" class="fiche-size-btn" data-fsize="xl">Très Grand (A++)</button>
        </div>

        <div class="fiche-theme-pill" title="Changer le thème de lecture">
          <button type="button" class="fiche-theme-btn" data-ftheme="light" title="Mode Clair">☀️ Clair</button>
          <button type="button" class="fiche-theme-btn" data-ftheme="sepia" title="Mode Papier Sepia doux pour les yeux">📜 Papier</button>
          <button type="button" class="fiche-theme-btn" data-ftheme="dark" title="Mode Sombre">🌙 Sombre</button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Full-Screen Study Layout -->
  <main class="fiche-page-main font-scale-lg" id="fichePageMain">
    <div id="ficheFullPageApp"></div>
  </main>

  <script src="js/vocabularyData.js"></script>
  <script src="js/b1FrequentWords.js"></script>
</body>
</html>
