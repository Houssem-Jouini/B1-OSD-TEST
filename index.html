<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zertifikat B1 — Lesen Prüfungssimulation</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="nav-container">
      <div class="brand">
        <div class="brand-badge" id="brandBadge">B1</div>
        <div>
          <div class="brand-title" id="brandTitle">Goethe / ÖSD B1 Prüfungssimulation</div>
          <div class="brand-sub" id="brandSub">Modul Lesen · 5 Teile · 65 Minuten</div>
        </div>
      </div>
      <div class="header-actions">
        <div class="test-selector-wrap">
          <label for="modelTestSelect" class="test-selector-label">Test:</label>
          <select id="modelTestSelect" class="test-selector" title="Modellsatz auswählen"></select>
        </div>
        <div class="timer-box" id="timerBox">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span id="timerDisplay">65:00</span>
          <button class="flag-btn" id="timerToggle" title="Timer Pause/Play" style="margin-left:2px;">
            <svg id="timerIcon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
          </button>
        </div>
        <button class="icon-btn" id="themeToggle" title="Theme wechseln">
          <svg id="themeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Candidate details banner -->
  <div class="candidate-banner" id="candidateBanner">
    <div class="candidate-input-wrap">
      <label for="friendName">Kandidat(in):</label>
      <input type="text" id="friendName" class="candidate-input" placeholder="Vollständiger Name">
    </div>
    <div class="font-size-controls">
      <button class="font-size-btn" data-size="14px">A-</button>
      <button class="font-size-btn active" data-size="15.5px">Standard</button>
      <button class="font-size-btn" data-size="17.5px">A+</button>
    </div>
  </div>

  <!-- Part Navigation Tabs -->
  <div class="tabs-wrapper" id="tabsWrapper">
    <nav class="tabs" id="tabs"></nav>
  </div>

  <!-- Main Split Layout Area -->
  <main class="main-container" id="testAreaContainer">
    <div class="content-grid" id="testGrid">
      <!-- Left: Reading Passage (Sticky) -->
      <section class="panel sticky-panel" id="passagePanel"></section>
      <!-- Right: Questions & Options -->
      <section class="panel" id="questionsPanel"></section>
    </div>
  </main>

  <!-- Results Screen -->
  <main class="main-container" id="resultsScreen">
    <div class="results-hero">
      <div class="score-circle" id="scoreCircle">
        <div class="score-circle-inner">
          <div class="score-big" id="resTotalPts">0/30</div>
          <div class="score-pct" id="resTotalPct">0%</div>
        </div>
      </div>
      <div id="statusTag" class="status-tag pass">BESTANDEN</div>
      <p id="candidateCongrats" style="color:var(--text-muted); font-size:15px; margin-bottom:18px;"></p>
      <div style="display:flex; justify-content:center; gap:10px; flex-wrap:wrap;">
        <button class="btn btn-primary" id="copyBtn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
          Ergebnis kopieren
        </button>
        <button class="btn btn-outline" onclick="window.print()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/></svg>
          Drucken / PDF
        </button>
        <button class="btn btn-outline" id="restartBtn">Test neu starten</button>
      </div>
    </div>

    <div class="teil-scores-grid" id="teilScoresGrid"></div>

    <div class="review-panel">
      <div class="review-header">
        <h3 style="font-size:17px; font-weight:700;">Detaillierte Aufgabenübersicht</h3>
        <div class="filter-pills">
          <button class="filter-btn active" data-filter="all">Alle (30)</button>
          <button class="filter-btn" data-filter="incorrect">Falsch</button>
          <button class="filter-btn" data-filter="correct">Richtig</button>
        </div>
      </div>
      <div id="reviewItemsList"></div>
    </div>
  </main>

  <!-- Bottom Navigation -->
  <footer class="footer-actionbar" id="footerBar">
    <div class="footer-content">
      <div class="progress-info">
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <span class="progress-text" id="progressTxt">0 / 30 gelöst</span>
      </div>
      <div class="nav-buttons">
        <button class="btn btn-outline" id="prevTeilBtn">← Zurück</button>
        <button class="btn btn-outline" id="nextTeilBtn">Weiter →</button>
        <button class="btn btn-success" id="submitBtn" style="display:none;">Test abgeben</button>
      </div>
    </div>
  </footer>

<script src="testsData.js"></script>
<script src="script.js"></script>
</body>
</html>
